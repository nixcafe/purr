name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint + tests
        run: nix flake check

      - name: test report
        run: |
          nix build .#checks.x86_64-linux.purr-tests
          tail -n 2 result

      - name: flake show
        run: nix flake show
